services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-anc}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anc}"]
      interval: 5s
      retries: 10

  # BullMQ navbatlari va kesh uchun (keyingi bosqich: bildirishnomalar, embedding, imtihon sweeper)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  ai-engine:
    build: ./services/ai-engine
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_KEY: ${AI_INTERNAL_KEY}
    # Tashqariga ochilmaydi — faqat api konteyneri chaqiradi
    expose: ["8000"]

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production # .env dagi development qiymati konteynerga o'tmasin
      DATABASE_URL: postgresql://${POSTGRES_USER:-anc}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-anc}?schema=public
      AI_ENGINE_URL: http://ai-engine:8000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      ai-engine: { condition: service_started }

  admin:
    build: ./apps/admin
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]

  backup:
    build: ./ops/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-anc}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: ${POSTGRES_DB:-anc}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE .env da bo'lishi kerak}
      RETENTION_DAYS: 14
    volumes: [backups:/backups]
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes: [./ops/monitoring:/etc/prometheus:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  backups:
