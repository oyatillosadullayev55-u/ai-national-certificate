groups:
  - name: anc
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
      - alert: HighErrorRate
        expr: sum(rate(anc_http_errors_total[5m])) > 1
        for: 5m
      - alert: SlowP95
        expr: histogram_quantile(0.95, sum by (le) (rate(anc_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
